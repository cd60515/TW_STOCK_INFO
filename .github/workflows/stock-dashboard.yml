name: 台股戰情室 資料更新

on:
  schedule:
    # 收盤後兩次:17:20 台北(三大法人、本益比已公布)與 22:20 台北(補上較晚公布的融資融券)。
    # 兩次都會更新網站;盤後報告 email 只在當日資料完整(含融資融券)後寄一次。
    # GitHub 排程常有延遲,晚到也沒關係:程式會自動判斷最新已結算交易日。
    - cron: '20 9 * * 1-5'
    - cron: '20 14 * * 1-5'
  push:
    # 修改自選股清單或程式後自動重建網站
    branches: [main, 'claude/**']
    paths:
      - 'stock_dashboard/watchlist.json'
      - 'stock_dashboard/run.py'
      - 'stock_dashboard/collector/**'
      - 'stock_dashboard/site/index.html'
      - 'stock_dashboard/site/app.js'
      - 'stock_dashboard/site/style.css'
      - '.github/workflows/stock-dashboard.yml'
  workflow_dispatch:
    inputs:
      force_email:
        description: '即使今天已寄過/資料未完整也寄出報告 email(測試用)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: stock_dashboard/requirements.txt

      - run: pip install -r stock_dashboard/requirements.txt

      - name: 收集資料並產生網站
        run: python stock_dashboard/run.py ${{ github.ref == 'refs/heads/main' && '--email' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FORCE_EMAIL: '1'  # TEMP: 測試寄信用,確認後還原

      - name: 保存歷史資料與網站資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_dashboard/state stock_dashboard/site/data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
            exit 0
          fi
          git commit -m "盤後資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: 上傳單檔報告(可在 Actions 頁面下載)
        uses: actions/upload-artifact@v4
        with:
          name: stock-report
          path: stock_dashboard/site/report.html
          retention-days: 14

      - name: 準備 GitHub Pages
        if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: stock_dashboard/site

  deploy-pages:
    # 需要在 repo Settings > Pages 選擇 Source: GitHub Actions,並新增 repo 變數 ENABLE_PAGES=true
    if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
